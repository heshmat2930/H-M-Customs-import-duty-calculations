name: Build Android APK

on:
  push:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:

jobs:
  build:
    name: Build signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Release APK
        run: gradle --no-daemon clean assembleRelease

      - name: Generate temporary signing key
        run: |
          keytool -genkeypair -v \
            -keystore release-temp.jks \
            -storepass hmc-temp-password \
            -keypass hmc-temp-password \
            -alias hmc-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=H&M Customs, OU=Android, O=H&M Customs, C=IR"

      - name: Sign Release APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" sign \
            --ks release-temp.jks \
            --ks-key-alias hmc-release \
            --ks-pass pass:hmc-temp-password \
            --key-pass pass:hmc-temp-password \
            --out app/build/outputs/apk/release/H-M-Customs-import-duty-calculations.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/H-M-Customs-import-duty-calculations.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: H-M-Customs-import-duty-calculations-APK
          path: app/build/outputs/apk/release/H-M-Customs-import-duty-calculations.apk
          if-no-files-found: error
